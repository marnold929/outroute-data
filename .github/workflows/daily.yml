name: Daily rankings build

on:
  schedule:
    # Every 4 hours (00,04,08,12,16,20 UTC) — keeps rankings + player news fresh
    # through the day; worst-case staleness ~4h + one build's runtime.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab
  push:
    paths:
      - "pipeline/**"     # rebuild whenever the model or overrides change

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build players.json
        env:
          # Optional — when this repo secret is set, the build adds AI one-line
          # takes ("ai" field). Absent/invalid keys skip cleanly.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build.py

      - name: Commit & publish if changed
        run: |
          git config user.name "outroute-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/players.json
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Rankings update $(date -u +'%F %H:%MZ')"
            git push
          fi
